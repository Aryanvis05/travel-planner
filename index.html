
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Itinerary Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Travel Planner</h1>
        <p>Plan your next trip easily!</p>

        <form id="travelForm">
            <label>Destination</label>
            <input type="text" id="destination" placeholder="Enter destination" required>

            <label>Number of Days</label>
            <input type="number" id="days" min="1" max="30" placeholder="Enter days" required>

            <label>Budget (₹)</label>
            <input type="number" id="budget" min="1" placeholder="Enter budget" required>

            <label>Your Interest</label>
            <select id="interest">
                <option value="Nature">Nature</option>
                <option value="Adventure">Adventure</option>
                <option value="Food">Food</option>
                <option value="Historical Places">Historical Places</option>
                <option value="Shopping">Shopping</option>
            </select>

            <button type="submit">Generate Plan</button>
        </form>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
